<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸福天使｜品牌顧問後台 Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #b8860b; --gold-light: #d4a017; --gold-bright: #f0c040;
      --gold-pale: #fdf3d8; --gold-border: #e8d4a0;
      --brown-dark: #2a1a06; --brown-mid: #5a3a14; --brown-light: #8a6030;
      --cream: #fdfaf3; --dark: #1a1008; --dark-2: #251608;
      --green: #2f6f5e; --line-green: #06c755;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", sans-serif; background: #1a1008; color: #fff; min-height: 100vh; }

    /* 鎖定畫面 */
    #lockScreen {
      display: flex; position: fixed; inset: 0;
      background: linear-gradient(160deg, #1a1008, #2e1f0a, #1a1008);
      z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .lock-sun { font-size: 52px; margin-bottom: 14px; filter: drop-shadow(0 0 20px rgba(212,160,23,.9)); }
    .lock-title { font-family: "Noto Serif TC", serif; font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .lock-sub { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 28px; letter-spacing: 1px; }
    .lock-input {
      width: 100%; max-width: 260px; padding: 14px 18px;
      border: 1px solid rgba(184,134,11,.4); border-radius: 12px;
      font-size: 20px; text-align: center;
      background: rgba(255,255,255,.06); color: #fff;
      outline: none; letter-spacing: 6px;
      font-family: "Noto Sans TC", sans-serif;
    }
    .lock-input:focus { border-color: var(--gold); }
    .lock-btn {
      margin-top: 12px; width: 100%; max-width: 260px; padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 900;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
    }
    .lock-error { color: rgba(255,100,100,.8); font-size: 12px; margin-top: 8px; min-height: 18px; }

    #mainContent { display: none; }

    /* 頂部 */
    .header {
      background: linear-gradient(135deg, #1a1008, #2e1f0a);
      border-bottom: 1px solid rgba(184,134,11,.2);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-sun { font-size: 28px; filter: drop-shadow(0 0 10px rgba(212,160,23,.7)); }
    .header-title { font-family: "Noto Serif TC", serif; font-size: 16px; font-weight: 900; color: #fff; white-space: nowrap; }
    .header-sub { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 1px; }
    .header-badge {
      margin-left: auto;
      background: rgba(184,134,11,.2);
      border: 1px solid rgba(184,134,11,.3);
      color: var(--gold-bright);
      font-size: 10px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      letter-spacing: 1px; white-space: nowrap;
    }

    .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 80px; }

    /* 區塊標題 */
    .block-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      color: var(--gold); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .block-label::after { content: ''; flex: 1; height: 1px; background: rgba(184,134,11,.2); }

    /* 卡片 */
    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(184,134,11,.15);
      border-radius: 16px; padding: 18px; margin: 10px 0;
    }
    .card-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.8); margin-bottom: 12px; }

    /* 表單元素 */
    .field-label { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.45); margin: 10px 0 4px; letter-spacing: .5px; }
    select, input[type="text"], textarea {
      width: 100%; padding: 10px 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 10px; color: #fff;
      font-size: 14px; font-family: "Noto Sans TC", sans-serif;
      outline: none; transition: border-color .2s;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--gold); }
    select option { background: #2a1a06; color: #fff; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.7; }
    textarea.tall { min-height: 120px; }

    /* 方案選擇 */
    .plan-selector { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .plan-opt {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(184,134,11,.15);
      border-radius: 10px; padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; transition: all .18s;
    }
    .plan-opt input[type="radio"] { accent-color: var(--gold); width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; }
    .plan-opt.selected { background: rgba(184,134,11,.12); border-color: var(--gold); }
    .plan-opt-name { font-size: 13px; font-weight: 700; color: #fff; }
    .plan-opt-desc { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; line-height: 1.5; }

    /* 欄位行 */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 貼上區 */
    .paste-area {
      background: rgba(255,255,255,.04);
      border: 1px dashed rgba(184,134,11,.3);
      border-radius: 12px; padding: 14px;
      margin-top: 10px;
    }
    .paste-hint { font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 8px; line-height: 1.6; }
    .paste-preview {
      display: none; margin-top: 10px;
      background: rgba(184,134,11,.08);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 10px; padding: 12px;
    }
    .paste-preview.show { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .preview-field { font-size: 11px; }
    .preview-key { color: var(--gold); font-weight: 700; margin-bottom: 2px; }
    .preview-val { color: rgba(255,255,255,.7); line-height: 1.4; word-break: break-all; }
    .preview-val.empty { color: rgba(255,255,255,.2); font-style: italic; }

    /* 生成按鈕 */
    .gen-btn {
      display: block; width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 900;
      font-family: "Noto Sans TC", sans-serif;
      cursor: pointer; margin-top: 14px;
      box-shadow: 0 4px 16px rgba(184,134,11,.3);
      letter-spacing: .5px;
    }
    .clear-btn {
      display: block; width: 100%; padding: 11px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; font-size: 13px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 8px;
    }

    /* 結果區 */
    .result-area { display: none; margin-top: 16px; }
    .result-area.show { display: block; }

    .result-header {
      background: linear-gradient(135deg, rgba(184,134,11,.2), rgba(212,160,23,.1));
      border: 1px solid rgba(184,134,11,.3);
      border-radius: 16px 16px 0 0;
      padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-header-title { font-family: "Noto Serif TC", serif; font-size: 15px; font-weight: 900; color: #fff; }
    .copy-all-btn {
      background: var(--gold); color: #fff; border: none;
      border-radius: 999px; padding: 7px 16px;
      font-size: 12px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
    }
    .copy-all-btn.copied { background: #4caf50; }

    /* Tab */
    .result-tabs {
      display: flex;
      background: rgba(255,255,255,.04);
      border-left: 1px solid rgba(184,134,11,.2);
      border-right: 1px solid rgba(184,134,11,.2);
      overflow-x: auto;
    }
    .rtab {
      flex-shrink: 0; padding: 11px 14px;
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4);
      cursor: pointer; border: none; background: transparent;
      font-family: "Noto Sans TC", sans-serif;
      border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap;
    }
    .rtab.active { color: var(--gold-bright); border-bottom-color: var(--gold); }

    .rtab-content { display: none; }
    .rtab-content.active { display: block; }

    .result-body {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(184,134,11,.2);
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 18px;
    }
    .result-text {
      font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.8);
      white-space: pre-wrap; word-break: break-word;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(184,134,11,.15);
      border-radius: 10px; padding: 14px;
      max-height: 60vh; overflow-y: auto;
    }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(184,134,11,.15);
      border: 1px solid rgba(184,134,11,.3);
      color: var(--gold-bright); border-radius: 999px;
      padding: 8px 16px; font-size: 12px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
      margin-top: 10px; transition: all .18s;
    }
    .copy-btn.copied { background: rgba(76,175,80,.2); border-color: #4caf50; color: #4caf50; }

    @media (max-width: 480px) {
      .field-row { grid-template-columns: 1fr; }
      .paste-preview.show { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 鎖定畫面 -->
<div id="lockScreen">
  <div class="lock-sun">☀️</div>
  <div class="lock-title">幸福天使後台 Pro</div>
  <div class="lock-sub">品牌顧問指令中心</div>
  <input class="lock-input" type="password" id="pwInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')checkPw()">
  <button class="lock-btn" onclick="checkPw()">進入後台</button>
  <div class="lock-error" id="pwError"></div>
</div>

<div id="mainContent">

<div class="header">
  <div class="header-sun">☀️</div>
  <div>
    <div class="header-title">幸福天使｜品牌顧問後台</div>
    <div class="header-sub">AI協作指令產出中心</div>
  </div>
  <div class="header-badge">PRO VERSION</div>
</div>

<div class="wrap">

  <!-- 模式一：貼上試算表 -->
  <div class="block-label">快速模式｜從試算表貼入</div>
  <div class="card">
    <div class="card-title">貼上客戶素材庫資料（整行複製貼上）</div>
    <div class="paste-area">
      <div class="paste-hint">① 開試算表 02_品牌素材庫 → ② 選取客戶整行 → ③ 複製 → ④ 貼在這裡</div>
      <textarea id="pasteArea" rows="3" placeholder="貼上從試算表複製的整行資料…" oninput="parseRow()"></textarea>
    </div>
    <div class="paste-preview" id="previewGrid"></div>
  </div>

  <!-- 模式二：手動填寫 -->
  <div class="block-label" style="margin-top:20px">精準模式｜手動填寫客戶資料</div>
  <div class="card">
    <div class="field-row">
      <div>
        <div class="field-label">行業類型</div>
        <select id="f_industry">
          <option value="">請選擇</option>
          <option>健康食品／保健品</option>
          <option>美業／美容／美甲</option>
          <option>小農／手作／烘焙</option>
          <option>講師／顧問／教練</option>
          <option>房仲／保險／金融</option>
          <option>餐飲／在地店家</option>
          <option>生活用品／居家</option>
          <option>個人品牌／自媒體</option>
          <option>在家接單／服務業</option>
          <option>招生／教育</option>
          <option>其他</option>
        </select>
      </div>
      <div>
        <div class="field-label">希望客戶做什麼</div>
        <select id="f_cta_goal">
          <option value="">請選擇</option>
          <option>加LINE諮詢</option>
          <option>立即預約</option>
          <option>直接下單購買</option>
          <option>填問卷了解需求</option>
          <option>看更多案例作品</option>
          <option>加入社群</option>
        </select>
      </div>
    </div>
    <div class="field-row" style="margin-top:8px">
      <div>
        <div class="field-label">姓名／品牌名稱</div>
        <input type="text" id="f_name" placeholder="例：王小明 ／ 幸福烘焙坊">
      </div>
      <div>
        <div class="field-label">職稱／副標</div>
        <input type="text" id="f_title" placeholder="例：健康烘焙師">
      </div>
    </div>
    <div style="margin-top:8px">
      <div class="field-label">核心故事（為什麼做這件事）</div>
      <textarea class="tall" id="f_core_story" placeholder="客戶的核心故事…"></textarea>
    </div>
    <div style="margin-top:8px">
      <div class="field-label">目標客群與痛點</div>
      <textarea id="f_target_audience" placeholder="目標客群描述…"></textarea>
    </div>
    <div class="field-row" style="margin-top:8px">
      <div>
        <div class="field-label">品牌風格</div>
        <select id="f_style">
          <option value="">請選擇</option>
          <option>溫暖療癒，像朋友一樣</option>
          <option>專業權威，讓人信任放心</option>
          <option>活潑有趣，有能量有感染力</option>
          <option>質感生活，慢活精緻有品味</option>
          <option>真實親切，說真話有溫度</option>
        </select>
      </div>
      <div>
        <div class="field-label">不想要的感覺</div>
        <input type="text" id="f_avoid" placeholder="例：不要太推銷感">
      </div>
    </div>
    <div class="field-row" style="margin-top:8px">
      <div>
        <div class="field-label">有無實體據點</div>
        <select id="f_location">
          <option value="">請選擇</option>
          <option>有店面／工作室</option>
          <option>在家接單</option>
          <option>線上為主</option>
        </select>
      </div>
      <div>
        <div class="field-label">現有平台</div>
        <input type="text" id="f_platforms" placeholder="例：FB、IG、YouTube">
      </div>
    </div>
  </div>

  <!-- 合作方案選擇 -->
  <div class="block-label" style="margin-top:20px">合作方案｜決定交付內容</div>
  <div class="card">
    <div class="card-title">選擇合作方案（影響指令產出內容）</div>
    <div class="plan-selector">
      <label class="plan-opt" id="planOpt1">
        <input type="radio" name="plan" value="基礎" onchange="selectPlan(this)">
        <div>
          <div class="plan-opt-name">💡 基礎方案｜指令包＋教學</div>
          <div class="plan-opt-desc">給客戶自己操作的指令包，你負責教學和設定方向</div>
        </div>
      </label>
      <label class="plan-opt" id="planOpt2">
        <input type="radio" name="plan" value="中階" onchange="selectPlan(this)">
        <div>
          <div class="plan-opt-name">📱 中階方案｜半代工</div>
          <div class="plan-opt-desc">你幫客戶產出文案、圖文、腳本，客戶自己發布</div>
        </div>
      </label>
      <label class="plan-opt" id="planOpt3">
        <input type="radio" name="plan" value="全包" onchange="selectPlan(this)">
        <div>
          <div class="plan-opt-name">🚀 全包方案｜代操</div>
          <div class="plan-opt-desc">從內容產出到排程發布全部你來，客戶只看成果</div>
        </div>
      </label>
      <label class="plan-opt" id="planOpt4">
        <input type="radio" name="plan" value="名片建卡" onchange="selectPlan(this)">
        <div>
          <div class="plan-opt-name">📇 名片建卡方案</div>
          <div class="plan-opt-desc">只做智慧名片建卡，產出名片內容建議</div>
        </div>
      </label>
    </div>
  </div>

  <button class="gen-btn" onclick="generate()">產出 AI 協作指令包 ✦</button>
  <button class="clear-btn" onclick="clearAll()">清除重填</button>

  <!-- 結果區 -->
  <div class="result-area" id="resultArea">
    <div class="result-header">
      <div class="result-header-title">☀️ AI 協作指令包已產出</div>
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAll()">複製全部</button>
    </div>
    <div class="result-tabs">
      <button class="rtab active" onclick="switchTab(0,this)">📋 完整版</button>
      <button class="rtab" onclick="switchTab(1,this)">📇 名片建議</button>
      <button class="rtab" onclick="switchTab(2,this)">🎬 影音DNA</button>
      <button class="rtab" onclick="switchTab(3,this)">📦 交付清單</button>
      <button class="rtab" onclick="switchTab(4,this)">📅 執行時間軸</button>
    </div>
    <div class="result-body">
      <div class="rtab-content active" id="tab0">
        <div class="result-text" id="out_full"></div>
        <button class="copy-btn" onclick="copyOut('out_full',this)">複製完整指令</button>
      </div>
      <div class="rtab-content" id="tab1">
        <div class="result-text" id="out_card"></div>
        <button class="copy-btn" onclick="copyOut('out_card',this)">複製名片指令</button>
      </div>
      <div class="rtab-content" id="tab2">
        <div class="result-text" id="out_video"></div>
        <button class="copy-btn" onclick="copyOut('out_video',this)">複製影音指令</button>
      </div>
      <div class="rtab-content" id="tab3">
        <div class="result-text" id="out_delivery"></div>
        <button class="copy-btn" onclick="copyOut('out_delivery',this)">複製交付清單</button>
      </div>
      <div class="rtab-content" id="tab4">
        <div class="result-text" id="out_timeline"></div>
        <button class="copy-btn" onclick="copyOut('out_timeline',this)">複製時間軸</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
  const PW = '167777';
  const SK = 'angel_admin_pro';

  (function() {
    if (sessionStorage.getItem(SK) === PW) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    }
  })();

  function checkPw() {
    if (document.getElementById('pwInput').value === PW) {
      sessionStorage.setItem(SK, PW);
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else {
      document.getElementById('pwError').textContent = '密碼錯誤';
      document.getElementById('pwInput').value = '';
    }
  }

  // 試算表欄位對應
  const FIELDS = [
    { key: '送出時間', idx: 0 }, { key: '行業', idx: 1 }, { key: '希望客戶做什麼', idx: 2 },
    { key: '姓名品牌', idx: 3 }, { key: '職稱', idx: 4 }, { key: '公司', idx: 5 },
    { key: '核心故事', idx: 6 }, { key: '目標客群', idx: 7 },
    { key: '品牌風格', idx: 8 }, { key: '不想要', idx: 9 },
    { key: '電話', idx: 10 }, { key: 'Email', idx: 11 },
    { key: 'LINE個人', idx: 12 }, { key: 'LINE官方', idx: 13 }, { key: '地址', idx: 14 },
    { key: 'YouTube', idx: 15 }, { key: 'Facebook', idx: 16 },
    { key: 'Instagram', idx: 17 }, { key: '其他平台', idx: 18 }
  ];

  let parsed = {};

  function parseRow() {
    const raw = document.getElementById('pasteArea').value.trim();
    if (!raw) { document.getElementById('previewGrid').classList.remove('show'); return; }
    const cols = raw.split('\t');
    parsed = {};
    FIELDS.forEach(f => { parsed[f.key] = (cols[f.idx] || '').trim(); });

    // 自動填入手動欄位
    if (parsed['行業']) setVal('f_industry', parsed['行業']);
    if (parsed['希望客戶做什麼']) setVal('f_cta_goal', parsed['希望客戶做什麼']);
    if (parsed['姓名品牌']) document.getElementById('f_name').value = parsed['姓名品牌'];
    if (parsed['職稱']) document.getElementById('f_title').value = parsed['職稱'];
    if (parsed['核心故事']) document.getElementById('f_core_story').value = parsed['核心故事'];
    if (parsed['目標客群']) document.getElementById('f_target_audience').value = parsed['目標客群'];
    if (parsed['品牌風格']) setVal('f_style', parsed['品牌風格']);
    if (parsed['不想要']) document.getElementById('f_avoid').value = parsed['不想要'];

    const plats = [parsed['YouTube'], parsed['Facebook'], parsed['Instagram'], parsed['其他平台']].filter(Boolean).join('、');
    if (plats) document.getElementById('f_platforms').value = plats;
    if (parsed['地址']) document.getElementById('f_location').value = parsed['地址'] ? '有店面／工作室' : '線上為主';

    // 顯示預覽
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = FIELDS.slice(1, 10).map(f => {
      const val = parsed[f.key];
      return `<div class="preview-field"><div class="preview-key">${f.key}</div><div class="preview-val${val ? '' : ' empty'}">${val || '未填'}</div></div>`;
    }).join('');
    grid.classList.add('show');
  }

  function setVal(id, val) {
    const el = document.getElementById(id);
    if (!el) return;
    for (let i = 0; i < el.options.length; i++) {
      if (el.options[i].value.includes(val) || val.includes(el.options[i].value)) {
        el.selectedIndex = i; break;
      }
    }
  }

  function selectPlan(radio) {
    document.querySelectorAll('.plan-opt').forEach(o => o.classList.remove('selected'));
    radio.closest('.plan-opt').classList.add('selected');
  }

  function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function radioVal(name) { const el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; }

  function getPlatforms() {
    const p = v('f_platforms');
    return p || '尚無平台';
  }

  function generate() {
    const industry = v('f_industry');
    const name = v('f_name');
    const title = v('f_title');
    const story = v('f_core_story');
    const audience = v('f_target_audience');
    const style = v('f_style');
    const avoid = v('f_avoid');
    const ctaGoal = v('f_cta_goal');
    const location = v('f_location');
    const platforms = getPlatforms();
    const plan = radioVal('plan');

    if (!name || !story || !audience) { alert('請至少填寫：姓名品牌名稱、核心故事、目標客群'); return; }
    if (!plan) { alert('請選擇合作方案'); return; }

    const clientInfo = `【客戶基本資料】
行業：${industry || '未填'}
姓名／品牌：${name}
職稱：${title || '未填'}
核心故事：${story}
目標客群與痛點：${audience}
品牌風格：${style || '未填'}
不想要的感覺：${avoid || '未填'}
希望客戶做什麼：${ctaGoal || '未填'}
實體據點：${location || '未填'}
現有平台：${platforms}
合作方案：${plan}`;

    // ── 完整版指令 ──
    const fullPrompt = buildFullPrompt(clientInfo, industry, plan, name, audience, ctaGoal, location, platforms);
    const cardPrompt = buildCardPrompt(clientInfo);
    const videoPrompt = buildVideoPrompt(clientInfo, industry, platforms);
    const deliveryPrompt = buildDeliveryPrompt(clientInfo, plan, industry, name);
    const timelinePrompt = buildTimelinePrompt(clientInfo, plan, industry);

    document.getElementById('out_full').textContent = fullPrompt;
    document.getElementById('out_card').textContent = cardPrompt;
    document.getElementById('out_video').textContent = videoPrompt;
    document.getElementById('out_delivery').textContent = deliveryPrompt;
    document.getElementById('out_timeline').textContent = timelinePrompt;

    document.getElementById('resultArea').classList.add('show');
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
  }

  function buildFullPrompt(info, industry, plan, name, audience, ctaGoal, location, platforms) {
    return `你是「幸福天使品牌顧問」，請根據以下客戶資料，產出完整品牌分析與商業執行方案。

${info}

請依序完整產出以下所有內容：

1. 品牌故事（名片用）

每個14字以內（含標點），不能斷行，風格各異。
版本1：
版本2：
版本3：

═══════════════════════════

6. 品牌DNA文件

═══════════════════════════

11. 行業機會分析
這個行業（${industry}）目前的市場機會在哪裡？
目標客群（${audience}）的核心痛點是什麼？

12. 商業閉環設計
根據這個客戶的行業和目標（${ctaGoal}），設計一個具體的商業閉環：

- 回購機制（如何讓客戶再回來）
${location === '有店面／工作室' ? '- Google地圖策略（如何優化在地搜尋）' : ''}

13. 客戶需要準備的素材清單
具體列出這個行業需要準備的所有素材，分類說明：
【必備素材】

【可之後補充】

14. 核心金句 × 3
適合放在名片、社群、影音的品牌金句，有記憶點、有情感。`;
  }

  function buildCardPrompt(info) {
    return `你是「幸福天使品牌顧問」，請根據以下客戶資料，產出完整的智慧名片填寫建議。

  function buildDeliveryPrompt(info, plan, industry, name) {
    const deliveryMap = {

⚠️ 注意事項

      '中階': `【中階方案｜半代工交付清單】

你需要交付給客戶的內容：

📦 首月額外交付

      '全包': `【全包方案｜代操交付清單】

你負責的完整服務項目：

📦 內容產出

      '名片建卡': `【名片建卡方案｜交付清單】

📦 交付項目
□ 品牌故事（名片用，100-150字）
□ 一句話理念 × 3版本
□ 跑馬燈內容建議（3條）
□ 照片牆拍攝建議（5張方向）
□ CTA按鈕建議（3個）
□ AI產圖指令（個人品牌形象圖）
□ 名片建卡所需資料整理清單

📋 客戶需要準備
□ 個人照片（正面、清晰）
□ 品牌LOGO（PNG透明背景）

    };

    return `你是「幸福天使品牌顧問」，請根據以下客戶資料和合作方案，產出具體的交付說明。

1. 這個行業特別需要準備的素材（具體說明）

  }

  function buildTimelinePrompt(info, plan, industry) {
    const weeks = plan === '基礎' ? 2 : plan === '名片建卡' ? 1 : 4;
    return `你是「幸福天使品牌顧問」，請根據以下客戶資料，產出具體可執行的時間軸。

${info}

請產出${weeks}週執行時間軸：

格式：
【第X週】主題
你需要做什麼：（具體動作）
客戶需要配合：（具體動作）
預期完成：（具體成果）

要求：
1. 每個動作要具體，不能模糊
2. 說明你做什麼，客戶做什麼，分清楚責任
3. 結尾說明${weeks}週後的預期狀態
4. 根據行業（${industry}）的特性調整節奏`;
  }

  function switchTab(idx, el) {
    document.querySelectorAll('.rtab').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.querySelectorAll('.rtab-content').forEach((t, i) => t.classList.toggle('active', i === idx));
  }

  function copyOut(id, btn) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
      btn.textContent = '✓ 已複製';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function copyAll() {
    const full = document.getElementById('out_full').textContent;
    navigator.clipboard.writeText(full).then(() => {
      const btn = document.getElementById('copyAllBtn');
      btn.textContent = '✓ 已複製';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '複製全部'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function clearAll() {
    if (!confirm('確定清除所有填寫內容？')) return;
    ['f_industry','f_cta_goal','f_name','f_title','f_core_story','f_target_audience',
     'f_style','f_avoid','f_location','f_platforms'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('pasteArea').value = '';
    document.getElementById('previewGrid').classList.remove('show');
    document.getElementById('previewGrid').innerHTML = '';
    document.getElementById('resultArea').classList.remove('show');
    document.querySelectorAll('.plan-opt').forEach(o => o.classList.remove('selected'));
    document.querySelectorAll('input[name="plan"]').forEach(r => r.checked = false);
    parsed = {};
  }

  document.addEventListener('change', function(e) {
    if (e.target.type === 'radio' && e.target.name === 'plan') {
      selectPlan(e.target);
    }
  });
</script>
