<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸福天使｜品牌顧問後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #b8860b; --gold-light: #d4a017; --gold-bright: #f0c040;
      --gold-pale: #fdf3d8; --gold-border: #e8d4a0;
      --brown-dark: #2a1a06; --brown-mid: #5a3a14;
      --dark: #1a1008; --dark-2: #251608; --dark-3: #2e1f0a;
      --green: #06c755;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", sans-serif; background: var(--dark); color: #fff; min-height: 100vh; }

    /* 鎖定 */
    #lockScreen {
      display: flex; position: fixed; inset: 0;
      background: linear-gradient(160deg, var(--dark), var(--dark-3));
      z-index: 9999; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .lock-sun { font-size: 52px; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(212,160,23,.9)); }
    .lock-title { font-family: "Noto Serif TC", serif; font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .lock-sub { font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 28px; letter-spacing: 2px; }
    .lock-input {
      width: 100%; max-width: 260px; padding: 14px 18px;
      border: 1px solid rgba(184,134,11,.3); border-radius: 12px;
      font-size: 22px; text-align: center;
      background: rgba(255,255,255,.06); color: #fff;
      outline: none; letter-spacing: 8px;
      font-family: "Noto Sans TC", sans-serif;
    }
    .lock-input:focus { border-color: var(--gold); }
    .lock-btn {
      margin-top: 10px; width: 100%; max-width: 260px; padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 900;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
    }
    .lock-err { color: rgba(255,100,100,.7); font-size: 12px; margin-top: 8px; min-height: 18px; }

    #main { display: none; }

    /* 頂部 */
    .hdr {
      background: linear-gradient(135deg, var(--dark), var(--dark-3));
      border-bottom: 1px solid rgba(184,134,11,.15);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .hdr-sun { font-size: 26px; }
    .hdr-title { font-family: "Noto Serif TC", serif; font-size: 15px; font-weight: 900; color: #fff; }
    .hdr-sub { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 1px; }
    .hdr-badge {
      margin-left: auto;
      background: rgba(184,134,11,.15);
      border: 1px solid rgba(184,134,11,.25);
      color: var(--gold-bright);
      font-size: 10px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px; letter-spacing: 1px;
    }

    .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 80px; }

    /* 步驟標籤 */
    .step-label {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0 10px;
    }
    .step-num {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; flex-shrink: 0;
    }
    .step-text { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.7); }
    .step-line { flex: 1; height: 1px; background: rgba(184,134,11,.15); }

    /* 卡片 */
    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(184,134,11,.12);
      border-radius: 16px; padding: 18px;
    }
    .card-hint { font-size: 12px; color: rgba(255,255,255,.35); line-height: 1.7; margin-bottom: 10px; }

    textarea {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 10px; color: #fff;
      font-size: 14px; font-family: "Noto Sans TC", sans-serif;
      outline: none; transition: border-color .2s;
      resize: vertical; min-height: 70px; line-height: 1.7;
    }
    textarea:focus { border-color: var(--gold); }

    /* 預覽 */
    .preview {
      display: none; margin-top: 12px;
      background: rgba(184,134,11,.07);
      border: 1px solid rgba(184,134,11,.18);
      border-radius: 10px; padding: 12px;
      grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .preview.show { display: grid; }
    .pf-key { font-size: 10px; font-weight: 700; color: var(--gold); margin-bottom: 2px; letter-spacing: .5px; }
    .pf-val { font-size: 12px; color: rgba(255,255,255,.7); line-height: 1.5; word-break: break-all; }
    .pf-val.empty { color: rgba(255,255,255,.2); font-style: italic; }

    /* 方案選擇 */
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .plan-opt {
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(184,134,11,.15);
      border-radius: 12px; padding: 14px 12px;
      cursor: pointer; transition: all .18s; text-align: center;
    }
    .plan-opt input { display: none; }
    .plan-opt.sel {
      background: rgba(184,134,11,.15);
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(184,134,11,.2);
    }
    .plan-icon { font-size: 22px; margin-bottom: 6px; }
    .plan-name { font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 3px; }
    .plan-desc { font-size: 11px; color: rgba(255,255,255,.4); line-height: 1.5; }

    /* 按鈕 */
    .gen-btn {
      display: block; width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 900;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
      margin-top: 14px; letter-spacing: .5px;
      box-shadow: 0 4px 16px rgba(184,134,11,.3);
    }
    .clr-btn {
      display: block; width: 100%; padding: 11px;
      background: transparent; color: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; font-size: 13px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 8px;
    }

    /* 結果 */
    .result { display: none; margin-top: 20px; }
    .result.show { display: block; }

    .result-hdr {
      background: linear-gradient(135deg, rgba(184,134,11,.2), rgba(212,160,23,.08));
      border: 1px solid rgba(184,134,11,.3);
      border-radius: 14px 14px 0 0;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-hdr-title { font-family: "Noto Serif TC", serif; font-size: 14px; font-weight: 900; color: #fff; }
    .copy-all {
      background: var(--gold); color: #fff; border: none;
      border-radius: 999px; padding: 6px 14px;
      font-size: 11px; font-weight: 900;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
      white-space: nowrap;
    }
    .copy-all.done { background: #4caf50; }

    .tabs {
      display: flex; overflow-x: auto;
      background: rgba(255,255,255,.03);
      border-left: 1px solid rgba(184,134,11,.2);
      border-right: 1px solid rgba(184,134,11,.2);
    }
    .tab {
      flex-shrink: 0; padding: 10px 14px;
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,.35); cursor: pointer;
      border: none; background: transparent;
      font-family: "Noto Sans TC", sans-serif;
      border-bottom: 2px solid transparent;
      transition: all .18s; white-space: nowrap;
    }
    .tab.on { color: var(--gold-bright); border-bottom-color: var(--gold); }

    .tab-pane { display: none; }
    .tab-pane.on { display: block; }

    .result-body {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(184,134,11,.15);
      border-top: none; border-radius: 0 0 14px 14px;
      padding: 16px;
    }
    .out-text {
      font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.8);
      white-space: pre-wrap; word-break: break-word;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(184,134,11,.12);
      border-radius: 10px; padding: 14px;
      max-height: 55vh; overflow-y: auto;
    }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(184,134,11,.12);
      border: 1px solid rgba(184,134,11,.25);
      color: var(--gold-bright); border-radius: 999px;
      padding: 7px 14px; font-size: 11px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif; cursor: pointer;
      margin-top: 10px;
    }
    .copy-btn.done { background: rgba(76,175,80,.15); border-color: #4caf50; color: #4caf50; }

    @media (max-width: 400px) {
      .plan-grid { grid-template-columns: 1fr; }
      .preview.show { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-sun">☀️</div>
  <div class="lock-title">幸福天使後台</div>
  <div class="lock-sub">品牌顧問指令中心</div>
  <input class="lock-input" type="password" id="pw" placeholder="密碼" onkeydown="if(event.key==='Enter')unlock()">
  <button class="lock-btn" onclick="unlock()">進入</button>
  <div class="lock-err" id="pwErr"></div>
</div>

<div id="main">
  <div class="hdr">
    <div class="hdr-sun">☀️</div>
    <div>
      <div class="hdr-title">幸福天使｜品牌顧問後台</div>
      <div class="hdr-sub">AI 協作指令產出中心</div>
    </div>
    <div class="hdr-badge">PRO</div>
  </div>

  <div class="wrap">

    <!-- STEP 1 -->
    <div class="step-label">
      <div class="step-num">1</div>
      <div class="step-text">從試算表貼上客戶資料</div>
      <div class="step-line"></div>
    </div>
    <div class="card">
      <div class="card-hint">開試算表 03_品牌素材庫 → 選客戶整行（點行號）→ 複製 → 貼在這裡</div>
      <textarea id="paste" rows="3" placeholder="貼上整行資料…" oninput="parse()"></textarea>
      <div class="preview" id="prev"></div>
    </div>

    <!-- STEP 2 -->
    <div class="step-label">
      <div class="step-num">2</div>
      <div class="step-text">選擇合作方案</div>
      <div class="step-line"></div>
    </div>
    <div class="card">
      <div class="plan-grid">
        <label class="plan-opt" id="p1">
          <input type="radio" name="plan" value="名片建卡">
          <div class="plan-icon">📇</div>
          <div class="plan-name">名片建卡</div>
          <div class="plan-desc">只做智慧名片<br>產出建卡建議</div>
        </label>
        <label class="plan-opt" id="p2">
          <input type="radio" name="plan" value="基礎">
          <div class="plan-icon">💡</div>
          <div class="plan-name">基礎方案</div>
          <div class="plan-desc">指令包＋教學<br>客戶自己操作</div>
        </label>
        <label class="plan-opt" id="p3">
          <input type="radio" name="plan" value="中階">
          <div class="plan-icon">📱</div>
          <div class="plan-name">中階方案</div>
          <div class="plan-desc">半代工產出<br>客戶自己發布</div>
        </label>
        <label class="plan-opt" id="p4">
          <input type="radio" name="plan" value="全包">
          <div class="plan-icon">🚀</div>
          <div class="plan-name">全包代操</div>
          <div class="plan-desc">產出到發布<br>全部你來</div>
        </label>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step-label">
      <div class="step-num">3</div>
      <div class="step-text">產出 AI 協作指令包</div>
      <div class="step-line"></div>
    </div>
    <button class="gen-btn" onclick="gen()">產出指令包 ✦</button>
    <button class="clr-btn" onclick="clr()">清除重填</button>

    <!-- 結果 -->
    <div class="result" id="result">
      <div class="result-hdr">
        <div class="result-hdr-title">☀️ 指令包已產出</div>
        <button class="copy-all" id="caBtn" onclick="copyAll()">複製全部</button>
      </div>
      <div class="tabs">
        <button class="tab on" onclick="sw(0,this)">📋 完整版</button>
        <button class="tab" onclick="sw(1,this)">📇 名片建議</button>
        <button class="tab" onclick="sw(2,this)">🎬 影音DNA</button>
        <button class="tab" onclick="sw(3,this)">📦 交付清單</button>
        <button class="tab" onclick="sw(4,this)">📅 時間軸</button>
        <button class="tab" onclick="sw(5,this)">💬 LINE摘要</button>
      </div>
      <div class="result-body">
        <div class="tab-pane on" id="t0"><div class="out-text" id="o0"></div><button class="copy-btn" onclick="cp('o0',this)">複製</button></div>
        <div class="tab-pane" id="t1"><div class="out-text" id="o1"></div><button class="copy-btn" onclick="cp('o1',this)">複製</button></div>
        <div class="tab-pane" id="t2"><div class="out-text" id="o2"></div><button class="copy-btn" onclick="cp('o2',this)">複製</button></div>
        <div class="tab-pane" id="t3"><div class="out-text" id="o3"></div><button class="copy-btn" onclick="cp('o3',this)">複製</button></div>
        <div class="tab-pane" id="t4"><div class="out-text" id="o4"></div><button class="copy-btn" onclick="cp('o4',this)">複製</button></div>
        <div class="tab-pane" id="t5"><div class="out-text" id="o5"></div><button class="copy-btn" onclick="cp('o5',this)">複製</button></div>
      </div>
    </div>

  </div>
</div>

<script>
const PW='167777', SK='angel_pro';
(()=>{ if(sessionStorage.getItem(SK)===PW){ document.getElementById('lockScreen').style.display='none'; document.getElementById('main').style.display='block'; } })();
function unlock(){ if(document.getElementById('pw').value===PW){ sessionStorage.setItem(SK,PW); document.getElementById('lockScreen').style.display='none'; document.getElementById('main').style.display='block'; } else { document.getElementById('pwErr').textContent='密碼錯誤'; document.getElementById('pw').value=''; } }

// 欄位對應 03_品牌素材庫
const COLS=[
  {k:'送出時間',i:0},{k:'行業',i:1},{k:'CTA目標',i:2},
  {k:'姓名品牌',i:3},{k:'職稱',i:4},{k:'公司',i:5},
  {k:'核心故事',i:6},{k:'目標客群',i:7},
  {k:'品牌風格',i:8},{k:'不想要',i:9},
  {k:'電話',i:10},{k:'Email',i:11},
  {k:'LINE個人',i:12},{k:'LINE官方',i:13},{k:'地址',i:14},
  {k:'YouTube',i:15},{k:'Facebook',i:16},{k:'Instagram',i:17},{k:'其他平台',i:18}
];
let D={};

function parse(){
  const raw=document.getElementById('paste').value.trim();
  if(!raw){document.getElementById('prev').classList.remove('show');return;}
  const cols=raw.split('\t');
  D={};
  COLS.forEach(f=>{ D[f.k]=(cols[f.i]||'').trim(); });
  const prev=document.getElementById('prev');
  prev.innerHTML=COLS.slice(1,10).map(f=>{
    const v=D[f.k];
    return `<div><div class="pf-key">${f.k}</div><div class="pf-val${v?'':' empty'}">${v||'未填'}</div></div>`;
  }).join('');
  prev.classList.add('show');
}

function planVal(){ const el=document.querySelector('input[name="plan"]:checked'); return el?el.value:''; }

document.addEventListener('change',e=>{
  if(e.target.name==='plan'){
    document.querySelectorAll('.plan-opt').forEach(o=>o.classList.remove('sel'));
    e.target.closest('.plan-opt').classList.add('sel');
  }
});

function platforms(){ return [D['YouTube'],D['Facebook'],D['Instagram'],D['其他平台']].filter(Boolean).join('、')||'尚無平台'; }

function gen(){
  if(!D['姓名品牌']){alert('請先貼上客戶資料');return;}
  const plan=planVal();
  if(!plan){alert('請選擇合作方案');return;}

  const industry=D['行業']||'未填';
  const name=D['姓名品牌'];
  const title=D['職稱']||'';
  const story=D['核心故事']||'';
  const audience=D['目標客群']||'';
  const style=D['品牌風格']||'';
  const avoid=D['不想要']||'';
  const cta=D['CTA目標']||'';
  const plats=platforms();
  const hasLocation=!!(D['地址']);

  const base=`【客戶資料】
行業：${industry}
姓名／品牌：${name}${title?'　職稱：'+title:''}
核心故事：${story}
目標客群：${audience}
品牌風格：${style}
不想要的感覺：${avoid}
希望客戶做什麼：${cta}
現有平台：${plats}
${hasLocation?'實體據點：'+D['地址']:'線上為主'}
合作方案：${plan}`;

  // ── 完整版 ──
  document.getElementById('o0').textContent=`你是資深品牌顧問，專精中小型個人品牌商業閉環建立。
請根據以下客戶資料，產出一份完整、具體、可立即執行的品牌商業方案。

品質標準：
✦ 每句話都要具體可執行，不能有空話
✦ 每個建議都要說明「為什麼」
✦ 客戶看完要知道「我下一步做什麼」
✦ 你看完要知道「我要交付什麼」

${base}

═══════════════════════
📊 一、行業機會分析
═══════════════════════
請分析：
1. 這個行業（${industry}）目前最大的市場機會在哪裡？
2. 目標客群（${audience}）的核心痛點是什麼？具體說明3個。
3. 同行通常怎麼做？這個客戶的差異化機會在哪裡？
4. ${hasLocation?'有實體據點的優勢如何發揮？Google地圖策略？':'線上經營的關鍵成功因素是什麼？'}

═══════════════════════
🧬 二、品牌DNA
═══════════════════════
【說話的人】這個品牌用什麼視角說話？什麼樣的口吻？
【情緒底色】客戶看完這個品牌應該有什麼感覺？
【慣用語氣】具體描述說話方式（例：像朋友說話、像老師說話）
【慣用意象】哪些畫面、物件、場景反覆出現？列出5個
【禁止詞】哪些詞絕對不用？為什麼？列出5個
【核心差異】一句話說清楚這個品牌和同行最不同的地方

═══════════════════════
📇 三、智慧名片建議
═══════════════════════
1. 品牌故事（100-150字，有溫度、真實感）
2. 一句話理念 × 3版本（每個14字以內含標點，不能斷行）
   版本1（溫暖型）：
   版本2（專業型）：
   版本3（行動型）：
3. 跑馬燈內容（3-5條，用｜區隔，每條至少15字）
4. 照片牆建議 × 5張（每張說明：拍什麼、為什麼能建立信任）
5. CTA按鈕建議 × 3個（標題5-10字、連結類型、為什麼有效）

═══════════════════════
🎬 四、影音策略
═══════════════════════
1. 主力平台（依現有：${plats}）
   推薦平台＋原因＋發布頻率＋最佳時間
2. 內容主題方向 × 3
   每個含：標題、為什麼適合、具體內容示例
3. Hook句庫 × 6個
   痛點型 × 2、反差型 × 2、好奇型 × 2
4. 第一支影音完整製作指令
   （可直接給AI執行）
   包含：影片類型、前3秒Hook、內容架構、結尾CTA
5. AI產圖指令（ChatGPT DALL-E英文格式）

═══════════════════════
💼 五、商業閉環設計（${plan}方案）
═══════════════════════
根據行業特性設計具體閉環：
→ 流量入口：如何讓目標客群找到他？（具體渠道）
→ 信任建立：如何在30秒內讓人信任他？（具體方法）
→ 成交路徑：從第一次接觸到付款，具體步驟？
→ 回購機制：如何讓客戶持續回來？
${hasLocation?'→ Google地圖策略：具體優化步驟？':''}

═══════════════════════
