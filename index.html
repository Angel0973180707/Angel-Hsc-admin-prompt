<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸福天使｜品牌顧問後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #b8860b; --gold-light: #d4a017; --gold-bright: #f0c040;
      --gold-pale: #fdf3d8; --gold-border: #e8d4a0;
      --brown-dark: #2a1a06; --brown-mid: #5a3a14;
      --dark: #1a1008; --dark-2: #251608; --dark-3: #2e1f0a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", sans-serif; background: var(--dark); color: #fff; min-height: 100vh; }

    /* 鎖定 */
    #lockScreen {
      display: flex; position: fixed; inset: 0;
      background: linear-gradient(160deg, var(--dark), var(--dark-3));
      z-index: 9999; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .lock-sun { font-size: 52px; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(212,160,23,.9)); }
    .lock-title { font-family: "Noto Serif TC", serif; font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .lock-sub { font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 28px; letter-spacing: 2px; }
    .lock-input { width: 100%; max-width: 260px; padding: 14px 18px; border: 1px solid rgba(184,134,11,.3); border-radius: 12px; font-size: 22px; text-align: center; background: rgba(255,255,255,.06); color: #fff; outline: none; letter-spacing: 8px; font-family: "Noto Sans TC", sans-serif; }
    .lock-input:focus { border-color: var(--gold); }
    .lock-btn { margin-top: 10px; width: 100%; max-width: 260px; padding: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; font-family: "Noto Sans TC", sans-serif; cursor: pointer; }
    .lock-err { color: rgba(255,100,100,.7); font-size: 12px; margin-top: 8px; min-height: 18px; }

    #main { display: none; }

    /* 頂部 */
    .hdr { background: linear-gradient(135deg, var(--dark), var(--dark-3)); border-bottom: 1px solid rgba(184,134,11,.15); padding: 14px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
    .hdr-sun { font-size: 26px; }
    .hdr-title { font-family: "Noto Serif TC", serif; font-size: 15px; font-weight: 900; color: #fff; }
    .hdr-sub { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 1px; }
    .hdr-badge { margin-left: auto; background: rgba(184,134,11,.15); border: 1px solid rgba(184,134,11,.25); color: var(--gold-bright); font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 1px; }

    .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 80px; }

    /* 模式切換 */
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .mode-btn { background: rgba(255,255,255,.05); border: 1.5px solid rgba(184,134,11,.15); border-radius: 14px; padding: 16px 12px; cursor: pointer; text-align: center; transition: all .2s; }
    .mode-btn.active { background: rgba(184,134,11,.15); border-color: var(--gold); box-shadow: 0 0 0 1px rgba(184,134,11,.2); }
    .mode-icon { font-size: 26px; margin-bottom: 6px; }
    .mode-name { font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 3px; }
    .mode-desc { font-size: 11px; color: rgba(255,255,255,.4); line-height: 1.5; }
    .mode-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 5px; }
    .mode-tag.a { background: rgba(184,134,11,.2); color: var(--gold-bright); }
    .mode-tag.b { background: rgba(47,111,94,.3); color: #6fcfb0; }

    /* 步驟標籤 */
    .step-label { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; }
    .step-num { width: 28px; height: 28px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
    .step-text { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.6); }
    .step-line { flex: 1; height: 1px; background: rgba(184,134,11,.15); }

    /* 卡片 */
    .card { background: rgba(255,255,255,.05); border: 1px solid rgba(184,134,11,.12); border-radius: 16px; padding: 18px; margin-bottom: 10px; }
    .card-hint { font-size: 12px; color: rgba(255,255,255,.35); line-height: 1.7; margin-bottom: 10px; }

    /* 表單 */
    textarea { width: 100%; padding: 12px 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(184,134,11,.2); border-radius: 10px; color: #fff; font-size: 14px; font-family: "Noto Sans TC", sans-serif; outline: none; transition: border-color .2s; resize: vertical; min-height: 70px; line-height: 1.7; }
    textarea:focus { border-color: var(--gold); }

    /* 預覽 */
    .preview { display: none; margin-top: 12px; background: rgba(184,134,11,.07); border: 1px solid rgba(184,134,11,.18); border-radius: 10px; padding: 12px; grid-template-columns: 1fr 1fr; gap: 8px; }
    .preview.show { display: grid; }
    .pf-key { font-size: 10px; font-weight: 700; color: var(--gold); margin-bottom: 2px; letter-spacing: .5px; }
    .pf-val { font-size: 12px; color: rgba(255,255,255,.7); line-height: 1.5; word-break: break-all; }
    .pf-val.empty { color: rgba(255,255,255,.2); font-style: italic; }

    /* 方案選擇 */
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .plan-opt { background: rgba(255,255,255,.05); border: 1.5px solid rgba(184,134,11,.15); border-radius: 12px; padding: 14px 12px; cursor: pointer; transition: all .18s; text-align: center; }
    .plan-opt input { display: none; }
    .plan-opt.sel { background: rgba(184,134,11,.15); border-color: var(--gold); }
    .plan-icon { font-size: 22px; margin-bottom: 6px; }
    .plan-name { font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 3px; }
    .plan-desc { font-size: 11px; color: rgba(255,255,255,.4); line-height: 1.5; }

    /* 按鈕 */
    .gen-btn { display: block; width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; font-family: "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 14px; letter-spacing: .5px; box-shadow: 0 4px 16px rgba(184,134,11,.3); }
    .clr-btn { display: block; width: 100%; padding: 11px; background: transparent; color: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; font-size: 13px; font-weight: 700; font-family: "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 8px; }

    /* 結果 */
    .result { display: none; margin-top: 20px; }
    .result.show { display: block; }
    .result-hdr { background: linear-gradient(135deg, rgba(184,134,11,.2), rgba(212,160,23,.08)); border: 1px solid rgba(184,134,11,.3); border-radius: 14px 14px 0 0; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .result-hdr-title { font-family: "Noto Serif TC", serif; font-size: 14px; font-weight: 900; color: #fff; }
    .copy-all { background: var(--gold); color: #fff; border: none; border-radius: 999px; padding: 6px 14px; font-size: 11px; font-weight: 900; font-family: "Noto Sans TC", sans-serif; cursor: pointer; white-space: nowrap; }
    .copy-all.done { background: #4caf50; }
    .tabs { display: flex; overflow-x: auto; background: rgba(255,255,255,.03); border-left: 1px solid rgba(184,134,11,.2); border-right: 1px solid rgba(184,134,11,.2); }
    .tab { flex-shrink: 0; padding: 10px 14px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.35); cursor: pointer; border: none; background: transparent; font-family: "Noto Sans TC", sans-serif; border-bottom: 2px solid transparent; transition: all .18s; white-space: nowrap; }
    .tab.on { color: var(--gold-bright); border-bottom-color: var(--gold); }
    .tab-pane { display: none; }
    .tab-pane.on { display: block; }
    .result-body { background: rgba(255,255,255,.03); border: 1px solid rgba(184,134,11,.15); border-top: none; border-radius: 0 0 14px 14px; padding: 16px; }
    .out-text { font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.8); white-space: pre-wrap; word-break: break-word; background: rgba(255,255,255,.04); border: 1px solid rgba(184,134,11,.12); border-radius: 10px; padding: 14px; max-height: 55vh; overflow-y: auto; }
    .copy-btn { display: inline-flex; align-items: center; gap: 4px; background: rgba(184,134,11,.12); border: 1px solid rgba(184,134,11,.25); color: var(--gold-bright); border-radius: 999px; padding: 7px 14px; font-size: 11px; font-weight: 700; font-family: "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 10px; }
    .copy-btn.done { background: rgba(76,175,80,.15); border-color: #4caf50; color: #4caf50; }

    /* 模式面板 */
    .mode-panel { display: none; }
    .mode-panel.show { display: block; }

    @media (max-width: 400px) {
      .plan-grid { grid-template-columns: 1fr; }
      .preview.show { grid-template-columns: 1fr; }
      .mode-switch { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-sun">☀️</div>
  <div class="lock-title">幸福天使後台</div>
  <div class="lock-sub">品牌顧問指令中心</div>
  <input class="lock-input" type="password" id="pw" placeholder="密碼" onkeydown="if(event.key==='Enter')unlock()">
  <button class="lock-btn" onclick="unlock()">進入</button>
  <div class="lock-err" id="pwErr"></div>
</div>

<div id="main">
  <div class="hdr">
    <div class="hdr-sun">☀️</div>
    <div>
      <div class="hdr-title">幸福天使｜品牌顧問後台</div>
      <div class="hdr-sub">AI 協作指令產出中心</div>
    </div>
    <div class="hdr-badge">PRO</div>
  </div>

  <div class="wrap">

    <!-- 模式切換 -->
    <div class="step-label">
      <div class="step-num">1</div>
      <div class="step-text">選擇指令模式</div>
      <div class="step-line"></div>
    </div>

    <div class="mode-switch">
      <div class="mode-btn active" id="modeA" onclick="switchMode('A')">
        <div class="mode-icon">🔍</div>
        <div class="mode-name">診斷報告</div>
        <div class="mode-desc">客戶填完診斷<br>產出初步分析報告</div>
        <span class="mode-tag a">01_經營診斷</span>
      </div>
      <div class="mode-btn" id="modeB" onclick="switchMode('B')">
        <div class="mode-icon">🚀</div>
        <div class="mode-name">品牌方案</div>
        <div class="mode-desc">客戶填完素材<br>產出完整品牌方案</div>
        <span class="mode-tag b">03_品牌素材庫</span>
      </div>
    </div>

    <!-- 模式A｜診斷報告 -->
    <div class="mode-panel show" id="panelA">
      <div class="step-label">
        <div class="step-num">2</div>
        <div class="step-text">貼上 01_經營診斷 客戶資料</div>
        <div class="step-line"></div>
      </div>
      <div class="card">
        <div class="card-hint">開試算表 01_經營診斷 → 選客戶整行（點行號）→ 複製 → 貼在這裡</div>
        <textarea id="pasteA" rows="3" placeholder="貼上整行資料…" oninput="parseA()"></textarea>
        <div class="preview" id="prevA"></div>
      </div>

      <div class="step-label">
        <div class="step-num">3</div>
        <div class="step-text">產出診斷報告指令</div>
        <div class="step-line"></div>
      </div>
      <button class="gen-btn" onclick="genA()">產出診斷報告指令 ✦</button>
      <button class="clr-btn" onclick="clrA()">清除重填</button>

      <div class="result" id="resultA">
        <div class="result-hdr">
          <div class="result-hdr-title">🔍 診斷報告指令已產出</div>
          <button class="copy-all" id="caA" onclick="copyAllA()">複製全部</button>
        </div>
        <div class="tabs">
          <button class="tab on" onclick="swA(0,this)">📋 完整指令</button>
          <button class="tab" onclick="swA(1,this)">💬 LINE摘要</button>
        </div>
        <div class="result-body">
          <div class="tab-pane on" id="a0"><div class="out-text" id="oa0"></div><button class="copy-btn" onclick="cp('oa0',this)">複製</button></div>
          <div class="tab-pane" id="a1"><div class="out-text" id="oa1"></div><button class="copy-btn" onclick="cp('oa1',this)">複製</button></div>
        </div>
      </div>
    </div>

    <!-- 模式B｜品牌方案 -->
    <div class="mode-panel" id="panelB">
      <div class="step-label">
        <div class="step-num">2</div>
        <div class="step-text">貼上 03_品牌素材庫 客戶資料</div>
        <div class="step-line"></div>
      </div>
      <div class="card">
        <div class="card-hint">開試算表 03_品牌素材庫 → 選客戶整行（點行號）→ 複製 → 貼在這裡</div>
        <textarea id="pasteB" rows="3" placeholder="貼上整行資料…" oninput="parseB()"></textarea>
        <div class="preview" id="prevB"></div>
      </div>

      <div class="step-label">
        <div class="step-num">3</div>
        <div class="step-text">選擇合作方案</div>
        <div class="step-line"></div>
      </div>
      <div class="card">
        <div class="plan-grid">
          <label class="plan-opt" id="p1"><input type="radio" name="plan" value="名片建卡">
            <div class="plan-icon">📇</div>
            <div class="plan-name">名片建卡</div>
            <div class="plan-desc">只做智慧名片</div>
          </label>
          <label class="plan-opt" id="p2"><input type="radio" name="plan" value="基礎">
            <div class="plan-icon">💡</div>
            <div class="plan-name">基礎方案</div>
            <div class="plan-desc">指令包＋教學</div>
          </label>
          <label class="plan-opt" id="p3"><input type="radio" name="plan" value="中階">
            <div class="plan-icon">📱</div>
            <div class="plan-name">中階方案</div>
            <div class="plan-desc">半代工產出</div>
          </label>
          <label class="plan-opt" id="p4"><input type="radio" name="plan" value="全包">
            <div class="plan-icon">🚀</div>
            <div class="plan-name">全包代操</div>
            <div class="plan-desc">產出到發布</div>
          </label>
        </div>
      </div>

      <div class="step-label">
        <div class="step-num">4</div>
        <div class="step-text">產出品牌方案指令</div>
        <div class="step-line"></div>
      </div>
      <button class="gen-btn" onclick="genB()">產出品牌方案指令 ✦</button>
      <button class="clr-btn" onclick="clrB()">清除重填</button>

      <div class="result" id="resultB">
        <div class="result-hdr">
          <div class="result-hdr-title">🚀 品牌方案指令已產出</div>
          <button class="copy-all" id="caB" onclick="copyAllB()">複製全部</button>
        </div>
        <div class="tabs">
          <button class="tab on" onclick="swB(0,this)">📋 完整版</button>
          <button class="tab" onclick="swB(1,this)">📇 名片建議</button>
          <button class="tab" onclick="swB(2,this)">🎬 影音DNA</button>
          <button class="tab" onclick="swB(3,this)">🔄 商業閉環</button>
          <button class="tab" onclick="swB(4,this)">📦 交付清單</button>
          <button class="tab" onclick="swB(5,this)">📅 時間軸</button>
          <button class="tab" onclick="swB(6,this)">💬 LINE摘要</button>
        </div>
        <div class="result-body">
          <div class="tab-pane on" id="b0"><div class="out-text" id="ob0"></div><button class="copy-btn" onclick="cp('ob0',this)">複製</button></div>
          <div class="tab-pane" id="b1"><div class="out-text" id="ob1"></div><button class="copy-btn" onclick="cp('ob1',this)">複製</button></div>
          <div class="tab-pane" id="b2"><div class="out-text" id="ob2"></div><button class="copy-btn" onclick="cp('ob2',this)">複製</button></div>
          <div class="tab-pane" id="b3"><div class="out-text" id="ob3"></div><button class="copy-btn" onclick="cp('ob3',this)">複製</button></div>
          <div class="tab-pane" id="b4"><div class="out-text" id="ob4"></div><button class="copy-btn" onclick="cp('ob4',this)">複製</button></div>
          <div class="tab-pane" id="b5"><div class="out-text" id="ob5"></div><button class="copy-btn" onclick="cp('ob5',this)">複製</button></div>
          <div class="tab-pane" id="b6"><div class="out-text" id="ob6"></div><button class="copy-btn" onclick="cp('ob6',this)">複製</button></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const PW='167777', SK='angel_pro';
(()=>{ if(sessionStorage.getItem(SK)===PW){ document.getElementById('lockScreen').style.display='none'; document.getElementById('main').style.display='block'; } })();
function unlock(){ if(document.getElementById('pw').value===PW){ sessionStorage.setItem(SK,PW); document.getElementById('lockScreen').style.display='none'; document.getElementById('main').style.display='block'; } else { document.getElementById('pwErr').textContent='密碼錯誤'; document.getElementById('pw').value=''; } }

// 模式切換
let curMode='A';
function switchMode(m){
  curMode=m;
  document.getElementById('modeA').classList.toggle('active',m==='A');
  document.getElementById('modeB').classList.toggle('active',m==='B');
  document.getElementById('panelA').classList.toggle('show',m==='A');
  document.getElementById('panelB').classList.toggle('show',m==='B');
}

// ── 01_經營診斷 欄位對應 ──
const COLS_A=[
  {k:'送出時間',i:0},{k:'姓名',i:1},{k:'電話',i:2},{k:'Email',i:3},
  {k:'LINE ID',i:4},{k:'品牌店名',i:5},{k:'產業',i:6},
  {k:'卡點',i:7},{k:'接單來源',i:8},{k:'希望客戶做什麼',i:9},
  {k:'已有素材',i:10},{k:'發展方向',i:11},{k:'自然流量目標',i:12},{k:'經營理念',i:13}
];

// ── 03_品牌素材庫 欄位對應 ──
const COLS_B=[
  {k:'送出時間',i:0},{k:'行業',i:1},{k:'CTA目標',i:2},
  {k:'姓名品牌',i:3},{k:'職稱',i:4},{k:'公司',i:5},
  {k:'核心故事',i:6},{k:'目標客群',i:7},
  {k:'品牌風格',i:8},{k:'不想要',i:9},
  {k:'電話',i:10},{k:'Email',i:11},
  {k:'LINE個人',i:12},{k:'LINE官方',i:13},{k:'地址',i:14},
  {k:'YouTube',i:15},{k:'Facebook',i:16},{k:'Instagram',i:17},{k:'其他平台',i:18}
];

let DA={}, DB={};

function parseRow(raw, cols){ const c=raw.split('\t'); const d={}; cols.forEach(f=>{ d[f.k]=(c[f.i]||'').trim(); }); return d; }

function renderPreview(d, cols, previewId){
  const el=document.getElementById(previewId);
  el.innerHTML=cols.slice(1,9).map(f=>{ const v=d[f.k]; return `<div><div class="pf-key">${f.k}</div><div class="pf-val${v?'':' empty'}">${v||'未填'}</div></div>`; }).join('');
  el.classList.add('show');
}

function parseA(){ const raw=document.getElementById('pasteA').value.trim(); if(!raw){document.getElementById('prevA').classList.remove('show');return;} DA=parseRow(raw,COLS_A); renderPreview(DA,COLS_A,'prevA'); }
function parseB(){ const raw=document.getElementById('pasteB').value.trim(); if(!raw){document.getElementById('prevB').classList.remove('show');return;} DB=parseRow(raw,COLS_B); renderPreview(DB,COLS_B,'prevB'); }

function planVal(){ const el=document.querySelector('input[name="plan"]:checked'); return el?el.value:''; }
function plats(){ return [DB['YouTube'],DB['Facebook'],DB['Instagram'],DB['其他平台']].filter(Boolean).join('、')||'尚無平台'; }

document.addEventListener('change',e=>{ if(e.target.name==='plan'){ document.querySelectorAll('.plan-opt').forEach(o=>o.classList.remove('sel')); e.target.closest('.plan-opt').classList.add('sel'); } });

// ════════════════════════════
// 模式A｜診斷報告指令
// ════════════════════════════
function genA(){
  if(!DA['姓名']){alert('請先貼上診斷資料');return;}

  const name=DA['姓名']||'';
  const industry=DA['產業']||'';
  const pains=DA['卡點']||'';
  const sources=DA['接單來源']||'';
  const cta=DA['希望客戶做什麼']||'';
  const materials=DA['已有素材']||'';
  const growth=DA['發展方向']||'';
  const mindset=DA['經營理念']||'';
  const brand=DA['品牌店名']||'';

  const base=`【客戶診斷資料】
姓名：${name}${brand?' ／ '+brand:''}
行業：${industry}
目前卡點：${pains}
