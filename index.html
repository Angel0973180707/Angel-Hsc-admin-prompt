<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸福天使｜品牌顧問後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c8860a;
      --gold-pale: #fff7e6;
      --gold-border: #e8d4a0;
      --brown-dark: #3d2a0e;
      --brown-mid: #6b4318;
      --brown-light: #9a6b3a;
      --green: #2f6f5e;
      --cream-2: #fff3dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", sans-serif; background: #fdf6e8; color: var(--brown-dark); }

    /* 鎖定畫面 */
    #lockScreen {
      display: flex; position: fixed; inset: 0;
      background: linear-gradient(160deg, #3d2a0e 0%, #7a4a18 60%, #c8860a 100%);
      z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .lock-icon { font-size: 52px; margin-bottom: 14px; }
    .lock-title { font-family: "Noto Serif TC", serif; font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .lock-sub { font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 24px; }
    .lock-input {
      width: 100%; max-width: 280px; padding: 14px 18px;
      border: 2px solid rgba(255,255,255,.3); border-radius: 999px;
      font-size: 20px; text-align: center; background: rgba(255,255,255,.15);
      color: #fff; outline: none; letter-spacing: 6px;
      font-family: "Noto Sans TC", sans-serif;
    }
    .lock-input::placeholder { color: rgba(255,255,255,.5); letter-spacing: 1px; font-size: 14px; }
    .lock-input:focus { border-color: rgba(255,255,255,.8); }
    .lock-btn {
      margin-top: 12px; width: 100%; max-width: 280px; padding: 14px;
      background: #fff; color: #c8860a; border: none; border-radius: 999px;
      font-size: 16px; font-weight: 900; font-family: "Noto Sans TC", sans-serif; cursor: pointer;
    }
    .lock-error { color: #ffcccc; font-size: 13px; margin-top: 10px; min-height: 20px; }

    /* 主內容 */
    #mainContent { display: none; }

    .header {
      background: linear-gradient(160deg, #3d2a0e 0%, #7a4a18 60%, #c8860a 100%);
      padding: 20px; display: flex; align-items: center; gap: 12px;
    }
    .header-icon { font-size: 32px; }
    .header-title { font-family: "Noto Serif TC", serif; font-size: 18px; font-weight: 900; color: #fff; white-space: nowrap; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 2px; }

    .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; }

    .notice {
      background: linear-gradient(135deg, #fff8e6, #fff0cc);
      border-left: 3px solid var(--gold);
      padding: 12px 14px; border-radius: 0 10px 10px 0;
      font-size: 13px; color: var(--brown-light); line-height: 1.8; margin: 12px 0;
    }

    .card { background: #fff; border-radius: 18px; padding: 18px; margin: 12px 0; border: 1px solid #f0e4c8; box-shadow: 0 3px 12px rgba(80,50,20,.06); }
    .card-title { font-family: "Noto Serif TC", serif; font-size: 15px; font-weight: 900; color: var(--brown-dark); margin-bottom: 12px; }

    textarea {
      width: 100%; padding: 14px;
      border: 1.5px solid var(--gold-border); border-radius: 12px;
      font-size: 14px; font-family: "Noto Sans TC", sans-serif;
      background: var(--gold-pale); color: var(--brown-dark);
      outline: none; resize: vertical; line-height: 1.7;
      transition: border-color .2s;
    }
    textarea:focus { border-color: var(--gold); }

    /* 解析預覽 */
    .preview-grid {
      display: none; margin-top: 14px;
      background: var(--gold-pale);
      border-radius: 12px; padding: 14px;
      border: 1px solid var(--gold-border);
    }
    .preview-grid.show { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .preview-item { font-size: 12px; }
    .preview-key { color: var(--gold); font-weight: 700; }
    .preview-val { color: var(--brown-dark); margin-top: 2px; line-height: 1.5; word-break: break-all; }
    .preview-val.empty { color: #ccc; font-style: italic; }

    .btn-generate {
      display: block; width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--gold), #e09820);
      color: #fff; border: none; border-radius: 999px;
      font-size: 16px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif;
      cursor: pointer; margin-top: 14px;
      box-shadow: 0 4px 16px rgba(200,134,10,.3);
      letter-spacing: 1px;
    }
    .btn-clear {
      display: block; width: 100%; padding: 12px;
      background: #f0e4c8; color: var(--brown-mid);
      border: none; border-radius: 999px;
      font-size: 14px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif;
      cursor: pointer; margin-top: 8px;
    }

    /* 結果區 */
    .result-area { display: none; margin-top: 16px; }
    .result-area.show { display: block; }

    .result-header {
      background: linear-gradient(135deg, #3d2a0e, #7a4a18);
      border-radius: 18px 18px 0 0; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-header-title { font-family: "Noto Serif TC", serif; font-size: 16px; font-weight: 900; color: #fff; }

    .result-body { background: #fff; border: 1px solid #f0e4c8; border-top: none; border-radius: 0 0 18px 18px; overflow: hidden; }

    .result-tab-nav { display: flex; border-bottom: 1px solid #f0e4c8; }
    .result-tab {
      flex: 1; padding: 12px 8px; text-align: center;
      font-size: 13px; font-weight: 700; color: var(--brown-light);
      cursor: pointer; border: none; background: #fff;
      font-family: "Noto Sans TC", sans-serif;
      border-bottom: 3px solid transparent;
      transition: all .2s;
    }
    .result-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .result-tab-content { display: none; padding: 18px; }
    .result-tab-content.active { display: block; }

    .result-text {
      font-size: 14px; line-height: 1.9; color: var(--brown-dark);
      white-space: pre-wrap; word-break: break-word;
      background: var(--gold-pale); border-radius: 12px;
      padding: 14px; border: 1px solid var(--gold-border);
    }

    .btn-copy {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--gold); color: #fff;
      border: none; border-radius: 999px;
      padding: 10px 20px; font-size: 14px; font-weight: 700;
      font-family: "Noto Sans TC", sans-serif;
      cursor: pointer; margin-top: 12px;
      transition: all .18s;
    }
    .btn-copy:hover { opacity: .88; }
    .btn-copy.copied { background: #4caf50; }

    @media (max-width: 480px) {
      .preview-grid.show { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 鎖定畫面 -->
<div id="lockScreen">
  <div class="lock-icon">☀️</div>
  <div class="lock-title">幸福天使後台</div>
  <div class="lock-sub">請輸入密碼進入</div>
  <input class="lock-input" type="password" id="pwInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')checkPw()">
  <button class="lock-btn" onclick="checkPw()">進入後台</button>
  <div class="lock-error" id="pwError"></div>
</div>

<!-- 主內容 -->
<div id="mainContent">

<div class="header">
  <div class="header-icon">☀️</div>
  <div>
    <div class="header-title">幸福天使｜品牌顧問後台</div>
    <div class="header-sub">貼上試算表資料，一鍵產出Claude指令</div>
  </div>
</div>

<div class="wrap">

  <div class="notice">
    ① 打開試算表 <b>01_客戶素材庫</b><br>
    ② 選取客戶那一整行（點行號選整行）<br>
    ③ 複製（Ctrl+C）<br>
    ④ 貼到下方文字框（Ctrl+V）<br>
    ⑤ 系統自動解析，按「產出指令」即可
  </div>

  <div class="card">
    <div class="card-title">貼上試算表資料</div>
    <textarea id="pasteArea" rows="4" placeholder="在這裡貼上從試算表複製的整行資料…" oninput="parseRow()"></textarea>
    <div class="preview-grid" id="previewGrid"></div>
    <button class="btn-generate" onclick="generate()">產出 Claude 分析指令 ✦</button>
    <button class="btn-clear" onclick="clearAll()">清除重填</button>
  </div>

  <!-- 結果區 -->
  <div class="result-area" id="resultArea">
    <div class="result-header">
      <div class="result-header-title">☀️ 指令已產出，選擇複製</div>
    </div>
    <div class="result-body">
      <div class="result-tab-nav">
        <button class="result-tab active" onclick="switchTab(0)">完整版</button>
        <button class="result-tab" onclick="switchTab(1)">名片建議</button>
        <button class="result-tab" onclick="switchTab(2)">影音DNA</button>
      </div>

      <div class="result-tab-content active" id="tab0">
        <div class="result-text" id="out_full"></div>
        <button class="btn-copy" onclick="copyOut('out_full', this)">複製完整指令</button>
      </div>
      <div class="result-tab-content" id="tab1">
        <div class="result-text" id="out_card"></div>
        <button class="btn-copy" onclick="copyOut('out_card', this)">複製名片指令</button>
      </div>
      <div class="result-tab-content" id="tab2">
        <div class="result-text" id="out_video"></div>
        <button class="btn-copy" onclick="copyOut('out_video', this)">複製影音指令</button>
      </div>
    </div>
  </div>

</div>
</div><!-- /mainContent -->

<script>
  // ── 密碼 ──
  const PW = '167777';
  const SK = 'angel_admin';
  (function() {
    if (sessionStorage.getItem(SK) === PW) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    }
  })();
  function checkPw() {
    if (document.getElementById('pwInput').value === PW) {
      sessionStorage.setItem(SK, PW);
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else {
      document.getElementById('pwError').textContent = '密碼錯誤，請再試一次';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  // ── 欄位順序對應試算表 ──
  // 送出時間(0) 行業(1) 希望客戶做什麼(2) 姓名(3) 職稱(4) 公司(5)
  // 核心故事(6) 目標客群(7) 品牌風格(8) 不想要(9)
  // 電話(10) Email(11) LINE個人(12) LINE官方(13) 地址(14)
  // YouTube(15) Facebook(16) Instagram(17) 其他平台(18)

  const FIELDS = [
    { key: '送出時間', idx: 0 },
    { key: '行業類型', idx: 1 },
    { key: '希望客戶做什麼', idx: 2 },
    { key: '姓名／品牌', idx: 3 },
    { key: '職稱', idx: 4 },
    { key: '公司', idx: 5 },
    { key: '核心故事', idx: 6 },
    { key: '目標客群痛點', idx: 7 },
    { key: '品牌風格', idx: 8 },
    { key: '不想要的感覺', idx: 9 },
    { key: '電話', idx: 10 },
    { key: 'Email', idx: 11 },
    { key: 'LINE個人', idx: 12 },
    { key: 'LINE官方', idx: 13 },
    { key: '地址', idx: 14 },
    { key: 'YouTube', idx: 15 },
    { key: 'Facebook', idx: 16 },
    { key: 'Instagram', idx: 17 },
    { key: '其他平台', idx: 18 }
  ];

  let parsed = {};

  function parseRow() {
    const raw = document.getElementById('pasteArea').value.trim();
    if (!raw) {
      document.getElementById('previewGrid').classList.remove('show');
      document.getElementById('previewGrid').innerHTML = '';
      return;
    }
    const cols = raw.split('\t');
    parsed = {};
    FIELDS.forEach(function(f) {
      parsed[f.key] = (cols[f.idx] || '').trim();
    });

    // 顯示預覽
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = FIELDS.slice(1, 11).map(function(f) {
      const val = parsed[f.key];
      return '<div class="preview-item"><div class="preview-key">' + f.key + '</div><div class="preview-val' + (val ? '' : ' empty') + '">' + (val || '未填') + '</div></div>';
    }).join('');
    grid.classList.add('show');
  }

  function getPlatforms() {
    const p = [];
    if (parsed['YouTube']) p.push('YouTube：' + parsed['YouTube']);
    if (parsed['Facebook']) p.push('Facebook：' + parsed['Facebook']);
    if (parsed['Instagram']) p.push('Instagram：' + parsed['Instagram']);
    if (parsed['其他平台']) p.push('其他：' + parsed['其他平台']);
    return p.length ? p.join('、') : '尚無平台';
  }

  function generate() {
    const raw = document.getElementById('pasteArea').value.trim();
    if (!raw) { alert('請先貼上試算表資料'); return; }
    if (!parsed['姓名／品牌']) { alert('資料解析失敗，請確認已複製正確的資料列'); return; }

    const info = `【客戶資料】
行業：${parsed['行業類型'] || '未填'}
姓名／品牌：${parsed['姓名／品牌']}
職稱：${parsed['職稱'] || '未填'}
公司：${parsed['公司'] || '未填'}
希望客戶做什麼：${parsed['希望客戶做什麼'] || '未填'}
核心故事：${parsed['核心故事'] || '未填'}
目標客群與痛點：${parsed['目標客群痛點'] || '未填'}
品牌風格：${parsed['品牌風格'] || '未填'}
不想要的感覺：${parsed['不想要的感覺'] || '未填'}
現有平台：${getPlatforms()}`;

    document.getElementById('out_full').textContent =
`你是「幸福天使品牌顧問」，請根據以下客戶資料，產出完整品牌分析報告。

${info}

請依序產出以下內容：

📇 Part A｜智慧名片建議

1. 品牌故事
100-150字，有溫度、真實感，適合放在智慧名片上。

2. 一句話理念 × 3版本
每個14字以內（含標點），不能斷行，風格各異讓客戶選擇。
版本1：
版本2：
版本3：

3. 跑馬燈內容
3-5條訊息，用｜區隔，每條至少15字，適合循環播放。

4. 照片牆建議
3張照片拍攝方向建議，附上ChatGPT產圖指令（英文）。

5. CTA按鈕建議
推薦3-5個CTA，每個含：按鈕標題（5-10字）、建議連結類型、為什麼適合。

🎬 Part B｜影音品牌DNA＋製作建議

6. 品牌DNA文件
說話的人／情緒底色／慣用語氣／禁止詞／慣用意象

7. 建議發布平台＋頻率
推薦1-2個主力平台，說明原因，建議發布頻率和最佳時間。

8. 內容主題方向 × 3
每個含標題＋為什麼適合這個客戶。

9. 第一支影音製作指令
可直接給AI執行，含影片類型、開頭Hook、主要內容、結尾CTA、適合平台。

10. AI產圖指令（ChatGPT DALL-E格式）
英文，含風格、色調、構圖、人物、氛圍。`;

    document.getElementById('out_card').textContent =
`你是「幸福天使品牌顧問」，請根據以下客戶資料，產出智慧名片填寫建議。

${info}

請產出：
1. 品牌故事（100-150字，有溫度真實感，適合名片）
2. 一句話理念 × 3版本（每個14字以內含標點，不能斷行）
3. 跑馬燈內容（3-5條，用｜區隔，每條至少15字）
4. 照片牆建議（3張拍攝方向＋ChatGPT產圖指令英文）
5. CTA按鈕建議（3-5個，含標題、連結類型、理由）`;

    document.getElementById('out_video').textContent =
`你是「幸福天使品牌顧問」，請根據以下客戶資料，產出影音品牌DNA與製作建議。

${info}

請產出：
1. 品牌DNA文件（說話視角、情緒底色、慣用語氣、禁止詞、慣用意象）
2. 建議發布平台＋頻率（1-2個主力平台，說明原因和最佳發布時間）
3. 內容主題方向 × 3（標題＋為什麼適合）
4. 第一支影音製作指令（可直接給AI執行）
5. AI產圖指令（ChatGPT DALL-E英文格式）`;

    document.getElementById('resultArea').classList.add('show');
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
  }

  function switchTab(idx) {
    document.querySelectorAll('.result-tab').forEach(function(t, i) {
      t.classList.toggle('active', i === idx);
    });
    document.querySelectorAll('.result-tab-content').forEach(function(t, i) {
      t.classList.toggle('active', i === idx);
    });
  }

  function copyOut(id, btn) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(function() {
      btn.textContent = '✓ 已複製';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = btn.id === 'out_full' ? '複製完整指令' : btn.textContent.replace('✓ 已複製', '複製');
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function clearAll() {
    document.getElementById('pasteArea').value = '';
    document.getElementById('previewGrid').classList.remove('show');
    document.getElementById('previewGrid').innerHTML = '';
    document.getElementById('resultArea').classList.remove('show');
    parsed = {};
  }
</script>
</body>
</html>
